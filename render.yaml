services:
  - type: web
    name: ai-track-app
    plan: starter
    region: oregon
    env: python
    autoDeploy: false
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: ./scripts/render_start.sh
    healthCheckPath: /snapshot
    envVars:
      - key: RTSP_URL
        sync: false
      - key: CONF_THRESHOLD
        value: "0.4"
      - key: REID
        value: "1"
      - key: REID_SIM
        value: "0.62"

